---
schema_version: 1
terms:
  abstract-reference:
    terms:
    # Concepts, evidence, and explanatory frames.
    - 契約
    - 観点
    - 意図
    - 役割
    - 根拠
    - 概念
    - 記述
    # Components, actors, and hierarchical relationships.
    - 構成要素
    - 部品
    - 開発者
    - 祖先
    - 子孫
    # Scope, separation, and organization.
    - 境界
    - 土台
    - 橋渡し
    - 入口
    - 場所
    - 一続き
    - 区別
    - 単発
    - 別枠
    # Resources and preparation.
    - コスト
    - 予算
    - 準備
    # Review context before choosing a katakana technical term.
    - 木
    - 余白
    question: Identify the concrete referent, components, role, or measurable work.
      For 入口, apply the shared role-metaphor criteria; a clear referent alone is
      not a sufficient reason to keep vague operation wording. Keep
      established technical meanings. For 木 and 余白, consider a context-appropriate
      katakana term (such as ツリー or マージン) only when it names the intended concept.
  weak-predicate:
    terms:
    # Use, interpretation, and understanding (literal-mode surfaces).
    - 利用します
    - 使えます
    - 使っています
    - 扱います
    - 扱えます
    - 扱いません
    - 意味しません
    - 把握します
    - 捉えます
    # Writing, representation, and inspection.
    - 記述します
    - 記述できます
    - 書きます
    - 示します
    - 表します
    - 表しません
    - 読みます
    - 調べます
    - 調べられます
    - 確かめます
    - 探します
    - 見落とします
    - 追えます
    # Inspect retrieval, interpretation, and invocation for any object.
    - 呼ぶ
    - 呼びます
    - 呼んで
    - 呼んだ
    - 読み取る
    - 読み取ります
    - 拾う
    - 拾います
    - 回収する
    - 回収します
    # Construction, preparation, and combination.
    - 用意します
    - 作ります
    - 組み立てられます
    - 組み合わせます
    - 積み重なります
    - 開放しています
    - 成り立たせています
    # Organization, comparison, and selection.
    - 整理します
    - 分ける
    - 分けて
    - 分けています
    - 分けません
    - 分けられます
    - 区別します
    - 区別できます
    - 混同しません
    - 混ぜません
    - そろえます
    - そろいます
    - まとまっています
    - 選びます
    - 選べます
    - 絞れます
    - 決まります
    # Change, transfer, and retention.
    - 変わります
    - 書き換える
    - 置き換えます
    - 加えます
    - 加わります
    - 付けます
    - 返す
    - 返します
    - 渡します
    - 送れます
    - 残します
    - 持ちます
    - 消しません
    # Existence, sufficiency, requirements, and completion.
    - あります
    - 足りません
    - 求めます
    - 到達しません
    - 避けられます
    - 終えられます
    - 抜けられます
    - 解消する
    question: Check whether the purpose, operation, or result is clear from the surrounding
      paragraph. Preserve negation and conditions.
  vague-degree:
    terms:
    - 浅い
    - 深い
    question: Identify the concrete depth, level, scope, or comparison. Keep literal
      measurements and established technical meanings.
  contextual-phrase:
    terms:
    # Limited exact surfaces for metaphorical operations, not banned verbs.
    - 地味に効く
    - 地味に効きます
    - 地味に効いて
    - 静かに壊れる
    - 静かに壊れます
    - 静かに壊れて
    - 時間を溶かす
    - 時間を溶かします
    - 時間を溶かした
    - 側に倒す
    - 側に倒します
    - 側に倒して
    - これらを
    - であることだけでは
    - あるものとします
    # Retain this specific phrase for existing allow lists and fuller evidence.
    - わけではありません
    - 別です
    # Unusual technical translations; shared criteria own the alternatives.
    - 木全体
    - 構築入口
    - 実装の読解
    - エラーを回収する
    - エラーを回収します
    - 介入パターン
    - 拡張点
    # Object-specific everyday verbs, not general bans on these verbs.
    - ツールを呼ぶ
    - ツールを呼びます
    - 責務を持つ
    - 指示を読み取る
    - 指示を読み取ります
    - 設定を書く
    - 値を拾う
    - 値を拾います
    - 切り出す合図です
    # Indirect capabilities and prerequisites; preserve their modality.
    - したりできます
    - することが前提です
    # Preserve capability, distributed structure, and the responsible actor.
    - 切り替えで扱えます
    - 分かれて現れます
    - 担保しなければなりません
    # Compressed noun relationships; suggestions are not automatic replacements.
    - 明示選択
    - 欠落理由
    # Referents, separation, evaluation, and sufficiency.
    - よいこと
    - おそれ
    - 別の
    - 別に
    - 空の
    - 別々に
    - ことだけで
    - 目安です
    - 必要がありません
    # Shared qualifications cover longer expressions without enumerating them.
    - ではありません
    - にはなりません
    - にはできません
    - にはしません
    - ことはしません
    - 代用にしません
    - でもありません
    - してはいけません
    - 表してはいません
    question: Apply the shared prose criteria to terminology, operation wording,
      indirect predicates, and qualifications. Check whether the phrase adds a condition that changes the reader's
      interpretation or action. If it only denies an overbroad reading already
      excluded by the main claim, revise that claim or remove the qualification.
      Preserve necessary negation, uncertainty, and technical boundaries. For
      明示選択 and 欠落理由, consider making the relationship explicit (明示的選択 and
      欠落した理由) if that preserves the meaning.
      For metaphorical operations, identify the actual effect, policy, work, or
      failure state from evidence; do not invent logging behavior, causes, or
      implementation details. Keep literal and established technical meanings.
  generic-framing:
    terms:
    - 重要なのは
    - ポイントは
    - 本章では
    - ここでは
    - まとめると
    - このように
    - 要するに
    # Author-centered discovery, indirect explanation, and unsupported emphasis.
    - 見えてきます
    - 理由がここにあります
    - 設計の肝
    question: Check whether this opening or recap adds a claim, scope, or consequence
      beyond the surrounding prose. Keep useful framing; otherwise state the
      substantive claim directly. Do not force a uniform sentence pattern.
